<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика, Шахматы и 2048</title>
    
    <!-- MathJax для формул -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Chess.js для правил шахмат -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: rgba(51, 65, 85, 0.8);
            --btn-hover: rgba(71, 85, 105, 0.9);
            --btn-text: #f8fafc;
            --correct: #10b981;
            --wrong: #ef4444;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --warning: #f59e0b;
            
            /* Цвета для шахмат (классические зеленые, приятные глазу) */
            --board-light: #eeeed2;
            --board-dark: #769656;
            --board-highlight: rgba(255, 255, 51, 0.5); /* Желтая подсветка хода */
            --board-check: radial-gradient(circle, #ff6b6b 20%, transparent 80%); /* Красный шах */
            --board-select: rgba(139, 92, 246, 0.6);
            --board-move: rgba(16, 185, 129, 0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-attachment: fixed;
            box-sizing: border-box;
            touch-action: pan-y;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #a78bfa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .hidden { display: none !important; }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        @media (max-width: 700px) { .menu-grid { grid-template-columns: 1fr; } }

        .menu-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .menu-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--accent);
        }
        .menu-icon { font-size: 50px; margin-bottom: 15px; }
        .menu-title { font-size: 18px; font-weight: bold; }

        /* --- ОБЩИЕ КНОПКИ --- */
        .main-btn {
            background: var(--accent); color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; margin: 5px; font-weight: bold;
        }
        .main-btn:hover { background: var(--accent-hover); }
        .secondary-btn { background: #475569; }
        .secondary-btn:hover { background: #334155; }

        /* --- ФИЗИКА --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 10px; }
        .progress-bar-container { flex-grow: 1; margin: 0 15px; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #8b5cf6, #10b981); width: 0%; transition: width 0.3s ease; }
        .question { font-size: 22px; font-weight: bold; margin-bottom: 20px; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media (max-width: 650px) { .options-grid { grid-template-columns: 1fr; } }
        .option-btn { background-color: var(--btn-bg); color: var(--btn-text); border: 1px solid rgba(255,255,255,0.05); padding: 15px 10px; font-size: 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-height: 60px; }
        .option-btn:hover:not(:disabled) { background-color: var(--btn-hover); transform: translateY(-2px); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.3; }
        .correct { background-color: var(--correct) !important; color: white !important; }
        .wrong { background-color: var(--wrong) !important; color: white !important; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .control-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 15px; }
        .control-btn:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .hint-btn { color: var(--warning); border-color: var(--warning); }
        .feedback { font-size: 18px; font-weight: bold; min-height: 25px; margin-bottom: 10px; }
        .result-score { font-size: 22px; margin-bottom: 10px; }
        .result-percent { font-size: 36px; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
        .result-rank { font-size: 32px; font-weight: 800; color: var(--correct); margin-bottom: 40px; text-transform: uppercase; }
        .study-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .study-section { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; border: 1px solid rgba(255,255,255,0.05); }
        .study-section h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid rgba(139, 92, 246, 0.3); padding-bottom: 10px; }
        .study-item { display: flex; flex-direction: column; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .study-name { font-weight: 600; margin-bottom: 5px; color: #cbd5e1; }
        .study-formula { font-size: 18px; color: #f8fafc; overflow-x: auto; }
        mjx-container { font-size: 1.1em !important; }

        /* --- ШАХМАТЫ (ОБНОВЛЕННЫЕ) --- */
        .chess-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chess-status { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 15px; min-height: 28px; }
        
        .board-container { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
            width: 100%; 
            max-width: 500px; 
            aspect-ratio: 1 / 1; 
            margin: 0 auto; 
            border: 4px solid rgba(255,255,255,0.2); 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        
        .square { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            cursor: pointer; 
            user-select: none; 
        }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Подсветка последнего хода (желтая) */
        .square.last-move::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--board-highlight); z-index: 1;
        }
        
        /* Подсветка выбранной фигуры */
        .square.selected::after { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: var(--board-select); opacity: 0.8; z-index: 2; 
        }
        
        /* Подсветка возможных ходов */
        .square.valid-move::before { 
            content: ''; position: absolute; width: 25%; height: 25%; border-radius: 50%; 
            background-color: rgba(0, 0, 0, 0.2); z-index: 3; 
        }
        .square.valid-capture::before { 
            content: ''; position: absolute; width: 90%; height: 90%; border-radius: 50%; 
            border: 5px solid rgba(0, 0, 0, 0.2); background-color: transparent; z-index: 3; 
        }

        /* Подсветка короля под шахом */
        .square.in-check::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--board-check); z-index: 4;
        }
        
        .piece { 
            font-size: clamp(35px, 9vw, 60px); 
            line-height: 1; 
            z-index: 10; 
            position: relative; 
            pointer-events: none; 
            font-family: "Arial Unicode MS", "Segoe UI Symbol", sans-serif;
            transition: transform 0.1s;
        }
        
        /* Тени для фигур, чтобы они смотрелись объемно */
        .piece.white { 
            color: #ffffff; 
            text-shadow: 0 2px 3px rgba(0,0,0,0.4), 0 0 1px #000; 
        }
        .piece.black { 
            color: #1a1a1a; 
            text-shadow: 0 2px 3px rgba(255,255,255,0.2), 0 0 1px #fff; 
        }

        /* --- 2048 --- */
        .game-2048-container { position: relative; max-width: 400px; margin: 0 auto; }
        .score-box { background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 8px; display: inline-block; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .grid-2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; aspect-ratio: 1/1; }
        .tile-2048 { display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 900; border-radius: 8px; transition: all 0.15s ease-in-out; color: transparent; position: relative; }
        .tile-empty { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .tile-2 { background: #a78bfa; color: #1e1b4b; }
        .tile-4 { background: #8b5cf6; color: #1e1b4b; }
        .tile-8 { background: #34d399; color: #064e3b; }
        .tile-16 { background: #10b981; color: #022c22; }
        .tile-32 { background: #fbbf24; color: #451a03; }
        .tile-64 { background: #f59e0b; color: #451a03; }
        .tile-128 { background: #f87171; color: #450a0a; font-size: 24px; }
        .tile-256 { background: #ef4444; color: #450a0a; font-size: 24px; }
        .tile-512 { background: #38bdf8; color: #082f49; font-size: 24px; }
        .tile-1024 { background: #3b82f6; color: #082f49; font-size: 20px; }
        .tile-2048 { background: #e879f9; color: #4a044e; font-size: 20px; box-shadow: 0 0 20px #e879f9; }
        .tile-super { background: #f43f5e; color: white; font-size: 18px; box-shadow: 0 0 25px #f43f5e; }
        @keyframes appear { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .tile-new { animation: appear 0.2s ease-out; }
        .tile-merged { animation: pop 0.2s ease-in-out; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .overlay h2 { font-size: 32px; margin-bottom: 20px; color: var(--correct); text-align: center; padding: 0 10px; }
        .overlay.lose h2 { color: var(--wrong); }
    </style>
</head>
<body>

<div class="container">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu">
        <h1>Выберите режим</h1>
        <div class="menu-grid">
            <div class="menu-card" onclick="switchApp('physics')">
                <div class="menu-icon">⚛️</div>
                <div class="menu-title">Решать физику</div>
            </div>
            <div class="menu-card" onclick="switchApp('chess')">
                <div class="menu-icon">♟️</div>
                <div class="menu-title">Играть в шахматы</div>
            </div>
            <div class="menu-card" onclick="switchApp('2048')">
                <div class="menu-icon">🔢</div>
                <div class="menu-title">Играть в 2048</div>
            </div>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ: ФИЗИКА -->
    <div id="app-physics" class="hidden">
        <button class="main-btn secondary-btn" style="position: absolute; left: 20px; top: 20px; padding: 8px 15px;" onclick="switchApp('menu')">← Меню</button>
        <div id="test-screen">
            <h1 style="margin-top: 40px;">Тренажёр формул</h1>
            <div class="top-bar">
                <span id="hints-display">💡 50/50: 2</span>
                <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
                <span id="progress-text">Вопрос 1</span>
            </div>
            <div class="question" id="question">Загрузка...</div>
            <div class="options-grid" id="options"></div>
            <div class="controls">
                <button class="control-btn hint-btn" id="hint-btn" onclick="useHint()">💡 50/50</button>
                <button class="control-btn" id="skip-btn" onclick="skipQuestion()">⏭ Пропустить</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
        <div id="result-screen" class="hidden">
            <h1>Тест завершён!</h1>
            <div class="result-score" id="result-score">Баллы: 0 из 64</div>
            <div class="result-percent" id="result-percent">0%</div>
            <div class="result-rank" id="result-rank">Школьник</div>
            <button class="main-btn" onclick="startNewTest()">Начать заново</button>
            <button class="main-btn secondary-btn" onclick="showStudyScreen()">Изучать формулы</button>
        </div>
        <div id="study-screen" class="hidden">
            <div class="study-header">
                <h2>Все формулы</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="main-btn" onclick="startNewTest()">Начать тест</button>
                    <button class="main-btn secondary-btn" onclick="returnToResults()">Назад</button>
                </div>
            </div>
            <div id="study-content"></div>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ: ШАХМАТЫ -->
    <div id="app-chess" class="hidden">
        <div class="chess-header">
            <button class="main-btn secondary-btn" onclick="switchApp('menu')">← Меню</button>
            <h1 style="margin: 0;">Шахматы</h1>
            <button class="main-btn" onclick="startChess()">Заново</button>
        </div>
        <div class="chess-status" id="chess-status">Загрузка...</div>
        <div class="board-container" id="chess-board"></div>
        <div style="margin-top: 15px; font-size: 14px; color: var(--text-muted);">
            Вы играете: <span id="player-color" style="font-weight:bold; color: var(--accent);"></span>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ: 2048 -->
    <div id="app-2048" class="hidden">
        <div class="chess-header">
            <button class="main-btn secondary-btn" onclick="switchApp('menu')">← Меню</button>
            <h1 style="margin: 0;">2048</h1>
            <button class="main-btn" onclick="init2048()">Заново</button>
        </div>
        
        <div class="game-2048-container">
            <div class="score-box">Счёт: <span id="score-2048">0</span></div>
            <div class="grid-2048" id="grid-2048"></div>
            <div id="overlay-2048" class="overlay hidden">
                <h2 id="overlay-2048-text">Вы победили!</h2>
                <button class="main-btn" onclick="init2048()">Играть ещё</button>
            </div>
        </div>
        <div style="margin-top: 20px; color: var(--text-muted);">
            Управление: Стрелки или свайпы
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ПРИЛОЖЕНИЙ И СОХРАНЕНИЯ
    // ==========================================
    let currentApp = 'menu';

    function switchApp(appName) {
        currentApp = appName;
        localStorage.setItem('appMode', appName);

        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('app-physics').classList.add('hidden');
        document.getElementById('app-chess').classList.add('hidden');
        document.getElementById('app-2048').classList.add('hidden');

        if (appName === 'menu') {
            document.getElementById('main-menu').classList.remove('hidden');
        } else if (appName === 'physics') {
            document.getElementById('app-physics').classList.remove('hidden');
            loadPhysicsState();
        } else if (appName === 'chess') {
            document.getElementById('app-chess').classList.remove('hidden');
            loadChessState();
        } else if (appName === '2048') {
            document.getElementById('app-2048').classList.remove('hidden');
            load2048State();
        }
    }

    // ==========================================
    // ЛОГИКА ФИЗИКИ
    // ==========================================
    const mainFormulas = [
        { category: "Механика", name: "Проекция скорости при равномерном прямолинейном движении", formula: "v_x = \\frac{s_x}{t}" },
        { category: "Механика", name: "Средняя путевая скорость", formula: "v_{cp} = \\frac{S_{общ}}{t_{общ}}" },
        { category: "Механика", name: "Координата при равномерном прямолинейном движении", formula: "x(t) = x_0 + v_x t" },
        { category: "Механика", name: "Координата при равноускоренном прямолинейном движении", formula: "x(t) = x_0 + v_{0x}t + \\frac{a_x t^2}{2}" },
        { category: "Механика", name: "Проекция перемещения при равноускоренном движении", formula: "s_x = v_{0x}t + \\frac{a_x t^2}{2}" },
        { category: "Механика", name: "Проекция скорости при равноускоренном движении", formula: "v_x = v_{0x} + a_x t" },
        { category: "Механика", name: "Проекция ускорения при равноускоренном движении", formula: "a_x = \\frac{v_x - v_{0x}}{t}" },
        { category: "Механика", name: "Проекция перемещения без времени", formula: "s_x = \\frac{v_x^2 - v_{0x}^2}{2a_x}" },
        { category: "Механика", name: "Модуль линейной скорости по окружности", formula: "v = \\frac{2\\pi R}{T}" },
        { category: "Механика", name: "Модуль центростремительного ускорения", formula: "a_ц = \\frac{v^2}{R}" },
        { category: "Механика", name: "Плотность вещества", formula: "\\rho = \\frac{m}{V}" },
        { category: "Механика", name: "Второй закон Ньютона", formula: "\\vec{F} = m\\vec{a}" },
        { category: "Механика", name: "Третий закон Ньютона", formula: "\\vec{F}_{1\\to2} = -\\vec{F}_{2\\to1}" },
        { category: "Механика", name: "Сила трения скольжения", formula: "F_{тр} = \\mu N" },
        { category: "Механика", name: "Модуль силы упругости. Закон Гука", formula: "F_{упр} = k|\\Delta l|" },
        { category: "Механика", name: "Модуль силы всемирного тяготения", formula: "F = G\\frac{m_1 m_2}{R^2}" },
        { category: "Механика", name: "Сила тяжести", formula: "F_{тяж} = mg" },
        { category: "Механика", name: "Импульс тела", formula: "p = mv" },
        { category: "Механика", name: "Закон сохранения импульса", formula: "p_{10} + p_{20} = p_1 + p_2" },
        { category: "Механика", name: "Работа постоянной силы", formula: "A = Fs \\cos \\alpha" },
        { category: "Механика", name: "Механическая мощность", formula: "P = \\frac{A}{t}" },
        { category: "Механика", name: "Кинетическая энергия тела", formula: "E_к = \\frac{mv^2}{2}" },
        { category: "Механика", name: "Потенциальная энергия над Землёй", formula: "E_п = mgh" },
        { category: "Механика", name: "Полная механическая энергия", formula: "E = E_к + E_п" },
        { category: "Механика", name: "Закон сохранения механической энергии", formula: "E_{нач} = E_{кон}" },
        { category: "Механика", name: "Момент силы", formula: "M = Fl" },
        { category: "Механика", name: "Условие равновесия рычага", formula: "M_1 = M_2" },
        { category: "Механика", name: "КПД простого механизма", formula: "\\eta = \\frac{A_{пол}}{A_{затр}} \\cdot 100\\%" },
        { category: "Механика", name: "Давление твёрдого тела", formula: "p = \\frac{F}{S}" },

    let queue = [];
    let currentIndex = 0;
    let solvedCount = 0;
    let totalScore = 0;
    const maxScore = mainFormulas.length;
    
    let currentItem = null;
    let currentAttempt = 1;
    let isLocked = false;
    let hintsLeft = 2;
    let isStudyRendered = false;

    function savePhysicsState() {
        if (currentApp !== 'physics') return;
        const state = {
            screen: document.getElementById('test-screen').classList.contains('hidden') ? 
                   (document.getElementById('result-screen').classList.contains('hidden') ? 'study' : 'result') : 'test',
            queue, currentIndex, solvedCount, totalScore, hintsLeft, currentAttempt
        };
        localStorage.setItem('physicsState', JSON.stringify(state));
    }

    function loadPhysicsState() {
        const saved = localStorage.getItem('physicsState');
        if (saved) {
            const state = JSON.parse(saved);
            queue = state.queue || [];
            currentIndex = state.currentIndex || 0;
            solvedCount = state.solvedCount || 0;
            totalScore = state.totalScore || 0;
            hintsLeft = state.hintsLeft !== undefined ? state.hintsLeft : 2;
            
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.add('hidden');

            if (state.screen === 'result') {
                document.getElementById('result-screen').classList.remove('hidden');
                showResults(true);
            } else if (state.screen === 'study') {
                document.getElementById('study-screen').classList.remove('hidden');
                showStudyScreen(true);
            } else {
                document.getElementById('test-screen').classList.remove('hidden');
                if (queue.length > 0 && currentIndex < queue.length) {
                    currentItem = queue[currentIndex];
                    loadNextQuestion(true);
                } else {
                    startNewTest();
                }
            }
        } else {
            startNewTest();
        }
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startNewTest() {
        queue = shuffle([...mainFormulas]);
        currentIndex = 0;
        solvedCount = 0;
        totalScore = 0;
        hintsLeft = 2;
        
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('study-screen').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        
        updateHintsUI();
        loadNextQuestion();
    }

    function loadNextQuestion(isLoadingState = false) {
        if (currentIndex >= queue.length) {
            showResults();
            return;
        }

        currentItem = queue[currentIndex];
        currentAttempt = 1;
        isLocked = false;
        
        document.getElementById('feedback').textContent = "";
        document.getElementById('skip-btn').disabled = false;
        document.getElementById('hint-btn').disabled = hintsLeft === 0;

        const progressPercent = (solvedCount / maxScore) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        document.getElementById('progress-text').textContent = `${solvedCount} из ${maxScore}`;

        document.getElementById('question').textContent = currentItem.name;

        let options = [currentItem.formula];
        let allWrongPool = mainFormulas.filter(f => f.formula !== currentItem.formula).map(f => f.formula);
        allWrongPool = allWrongPool.concat(distractors);
        allWrongPool = shuffle(allWrongPool);

        for (let i = 0; i < 7; i++) {
            options.push(allWrongPool[i]);
        }

        options = shuffle(options);

        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = "";
        options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `\\(${option}\\)`;
            btn.onclick = () => checkAnswer(btn, option);
            optionsEl.appendChild(btn);
        });

        if (window.MathJax) {
            MathJax.typesetPromise([document.getElementById('question'), optionsEl]).catch(err => console.error(err));
        }
        
        savePhysicsState();
    }

    function checkAnswer(btn, selectedOption) {
        if (isLocked) return;
        
        if (selectedOption === currentItem.formula) {
            isLocked = true;
            btn.classList.add('correct');
            
            let points = 0;
            if (currentAttempt === 1) points = 1.0;
            else if (currentAttempt === 2) points = 0.5;
            else if (currentAttempt === 3) points = 0.25;
            
            totalScore += points;
            solvedCount++;
            
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = `Правильно! +${points} балл(а)`;
            feedbackEl.style.color = "var(--correct)";
            
            disableAllButtons();
            savePhysicsState();
            setTimeout(() => {
                currentIndex++;
                loadNextQuestion();
            }, 400); 
            
        } else {
            btn.classList.add('wrong');
            btn.disabled = true;
            currentAttempt++;

            if (currentAttempt > 3) {
                isLocked = true;
                solvedCount++;
                
                const feedbackEl = document.getElementById('feedback');
                feedbackEl.textContent = "Попытки закончились 😢 Правильный ответ подсвечен.";
                feedbackEl.style.color = "var(--wrong)";
                
                revealCorrectAnswer();
                disableAllButtons();
                savePhysicsState();
                setTimeout(() => {
                    currentIndex++;
                    loadNextQuestion();
                }, 1000);
            } else {
                const feedbackEl = document.getElementById('feedback');
                feedbackEl.textContent = `Ошибка! У вас осталось ${3 - currentAttempt + 1} попытки.`;
                feedbackEl.style.color = "var(--warning)";
                savePhysicsState();
            }
        }
    }

    function revealCorrectAnswer() {
        const buttons = document.getElementById('options').querySelectorAll('.option-btn');
        buttons.forEach(b => {
            if (b.innerHTML.includes(currentItem.formula)) {
                b.classList.add('correct');
            }
        });
    }

    function disableAllButtons() {
        const buttons = document.getElementById('options').querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        document.getElementById('skip-btn').disabled = true;
        document.getElementById('hint-btn').disabled = true;
    }

    function skipQuestion() {
        if (isLocked) return;
        
        queue.push(currentItem);
        currentIndex++;
        
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.textContent = "Вопрос отложен на конец.";
        feedbackEl.style.color = "var(--text-muted)";
        
        isLocked = true;
        disableAllButtons();
        savePhysicsState();
        
        setTimeout(() => {
            loadNextQuestion();
        }, 400);
    }

    function useHint() {
        if (hintsLeft <= 0 || isLocked) return;
        
        hintsLeft--;
        updateHintsUI();
        
        const buttons = Array.from(document.getElementById('options').querySelectorAll('.option-btn'));
        const wrongButtons = buttons.filter(b => !b.innerHTML.includes(currentItem.formula));
        
        shuffle(wrongButtons);
        for (let i = 0; i < 6; i++) {
            if (wrongButtons[i]) {
                wrongButtons[i].disabled = true;
                wrongButtons[i].style.opacity = '0.1';
            }
        }
        
        if (hintsLeft === 0) document.getElementById('hint-btn').disabled = true;
        savePhysicsState();
    }

    function updateHintsUI() {
        document.getElementById('hints-display').textContent = `💡 50/50: ${hintsLeft}`;
        document.getElementById('hint-btn').textContent = `💡 50/50`;
        if (hintsLeft === 0) document.getElementById('hint-btn').disabled = true;
    }

    function showResults(isLoading = false) {
        if (!isLoading) {
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            savePhysicsState();
        }

        const percent = (totalScore / maxScore) * 100;
        
        document.getElementById('result-score').textContent = `Баллы: ${totalScore.toFixed(2)} из ${maxScore}`;
        document.getElementById('result-percent').textContent = `${percent.toFixed(1)}%`;

        let rank = "";
        if (percent >= 93.7) rank = "Эйнштейн! 🏆";
        else if (percent >= 78.1) rank = "Ньютон 🍎";
        else if (percent >= 62.5) rank = "Архимед 🛁";
        else if (percent >= 46.8) rank = "Профессор 🎓";
        else if (percent >= 31.2) rank = "Учитель 📚";
        else if (percent >= 15.6) rank = "Студент 🎒";
        else rank = "Школьник 📝";

        document.getElementById('result-rank').textContent = rank;
    }

    function showStudyScreen(isLoading = false) {
        if (!isLoading) {
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.remove('hidden');
            savePhysicsState();
        }

        const studyContentEl = document.getElementById('study-content');
        if (!isStudyRendered) {
            const grouped = {};
            mainFormulas.forEach(f => {
                if (!grouped[f.category]) grouped[f.category] = [];
                grouped[f.category].push(f);
            });

            let html = "";
            for (const category in grouped) {
                html += `<div class="study-section">`;
                html += `<h3>${category}</h3>`;
                grouped[category].forEach(f => {
                    html += `
                        <div class="study-item">
                            <div class="study-name">${f.name}</div>
                            <div class="study-formula">\\(${f.formula}\\)</div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            studyContentEl.innerHTML = html;
            isStudyRendered = true;

            if (window.MathJax) {
                MathJax.typesetPromise([studyContentEl]).catch(err => console.error(err));
            }
        }
    }

    function returnToResults() {
        document.getElementById('study-screen').classList.add('hidden');
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        showResults(true);
    }

    // ==========================================
    // ЛОГИКА ШАХМАТ (ОБНОВЛЕНО)
    // ==========================================
    let game = new Chess();
    let playerColor = 'w';
    let selectedSquare = null;
    let validMoves = [];
    let isAiThinking = false;
    let lastMove = null; // Для подсветки хода

    const pieces = {
        'wK': '♚', 'wQ': '♛', 'wR': '♜', 'wB': '♝', 'wN': '♞', 'wP': '♟',
        'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
    };

    function startChess() {
        game = new Chess();
        playerColor = Math.random() < 0.5 ? 'w' : 'b';
        selectedSquare = null;
        validMoves = [];
        isAiThinking = false;
        lastMove = null;
        
        document.getElementById('player-color').textContent = playerColor === 'w' ? 'Белые' : 'Чёрные';
        
        saveChessState();
        renderBoard();
        updateChessStatus();
        
        if (playerColor === 'b') {
            makeAiMove();
        }
    }

    function saveChessState() {
        if (currentApp !== 'chess') return;
        const state = { fen: game.fen(), playerColor: playerColor };
        localStorage.setItem('chessState', JSON.stringify(state));
    }

    function loadChessState() {
        const saved = localStorage.getItem('chessState');
        if (saved) {
            const state = JSON.parse(saved);
            game = new Chess(state.fen);
            playerColor = state.playerColor;
            
            // Восстанавливаем последний ход для подсветки
            const history = game.history({ verbose: true });
            lastMove = history.length > 0 ? history[history.length - 1] : null;

            document.getElementById('player-color').textContent = playerColor === 'w' ? 'Белые' : 'Чёрные';
            renderBoard();
            updateChessStatus();
            
            if (game.turn() !== playerColor && !game.game_over()) {
                makeAiMove();
            }
        } else {
            startChess();
        }
    }

    function renderBoard() {
        const boardEl = document.getElementById('chess-board');
        boardEl.innerHTML = '';
        const boardState = game.board();

        // Находим позицию короля, если шах
        let kingInCheckSquare = null;
        if (game.in_check()) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = boardState[r][c];
                    if (p && p.type === 'k' && p.color === game.turn()) {
                        kingInCheckSquare = String.fromCharCode(97 + c) + (8 - r);
                    }
                }
            }
        }

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                let actualR = playerColor === 'w' ? r : 7 - r;
                let actualC = playerColor === 'w' ? c : 7 - c;

                let piece = boardState[actualR][actualC];
                let squareFile = String.fromCharCode(97 + actualC);
                let squareRank = 8 - actualR;
                let squareId = squareFile + squareRank;

                let squareDiv = document.createElement('div');
                squareDiv.className = `square ${(actualR + actualC) % 2 === 0 ? 'light' : 'dark'}`;
                squareDiv.id = squareId;

                // Подсветка последнего хода
                if (lastMove && (squareId === lastMove.from || squareId === lastMove.to)) {
                    squareDiv.classList.add('last-move');
                }

                // Подсветка короля под шахом
                if (squareId === kingInCheckSquare) {
                    squareDiv.classList.add('in-check');
                }

                if (selectedSquare === squareId) squareDiv.classList.add('selected');
                if (validMoves.includes(squareId)) {
                    if (piece) squareDiv.classList.add('valid-capture');
                    else squareDiv.classList.add('valid-move');
                }

                if (piece) {
                    let pieceSpan = document.createElement('span');
                    pieceSpan.className = `piece ${piece.color === 'w' ? 'white' : 'black'}`;
                    pieceSpan.innerHTML = pieces[piece.color + piece.type.toUpperCase()];
                    squareDiv.appendChild(pieceSpan);
                }

                squareDiv.onclick = () => handleSquareClick(squareId);
                boardEl.appendChild(squareDiv);
            }
        }
    }

    function handleSquareClick(squareId) {
        if (isAiThinking || game.game_over() || game.turn() !== playerColor) return;

        if (selectedSquare && validMoves.includes(squareId)) {
            const move = game.move({ from: selectedSquare, to: squareId, promotion: 'q' });
            lastMove = move; // Сохраняем ход для подсветки
            
            selectedSquare = null;
            validMoves = [];
            renderBoard();
            saveChessState();
            updateChessStatus();
            
            if (!game.game_over()) makeAiMove();
            return;
        }

        const piece = game.get(squareId);
        if (piece && piece.color === playerColor) {
            selectedSquare = squareId;
            const moves = game.moves({ square: squareId, verbose: true });
            validMoves = moves.map(m => m.to);
        } else {
            selectedSquare = null;
            validMoves = [];
        }
        renderBoard();
    }

    function updateChessStatus() {
        const statusEl = document.getElementById('chess-status');
        
        if (game.in_checkmate()) {
            statusEl.textContent = game.turn() === playerColor ? "Мат! Вы проиграли 😢" : "Мат! Вы победили! 🎉";
            statusEl.style.color = game.turn() === playerColor ? "var(--wrong)" : "var(--correct)";
        } else if (game.in_draw()) {
            statusEl.textContent = "Ничья! 🤝";
            statusEl.style.color = "var(--warning)";
        } else if (game.in_check()) {
            // ИСПРАВЛЕНИЕ ОШИБКИ С ШАХОМ
            if (game.turn() === playerColor) {
                statusEl.textContent = "Вам шах! ⚠️";
                statusEl.style.color = "var(--wrong)";
            } else {
                statusEl.textContent = "Шах боту! 🔥";
                statusEl.style.color = "var(--correct)";
            }
        } else {
            statusEl.textContent = isAiThinking ? "Бот думает..." : "Ваш ход";
            statusEl.style.color = "var(--accent)";
        }
    }

    function makeAiMove() {
        isAiThinking = true;
        updateChessStatus();
        setTimeout(() => {
            const bestMove = getBestMove(game, 2);
            if (bestMove) {
                const move = game.move(bestMove);
                lastMove = move; // Сохраняем ход бота для подсветки
            }
            isAiThinking = false;
            renderBoard();
            saveChessState();
            updateChessStatus();
        }, 300);
    }

    function evaluateBoard(game) {
        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
        let totalEvaluation = 0;
        game.board().forEach(row => {
            row.forEach(piece => {
                if (piece) {
                    let val = pieceValues[piece.type];
                    if (piece.color === 'w') totalEvaluation += val;
                    else totalEvaluation -= val;
                }
            });
        });
        return totalEvaluation;
    }

    function minimax(depth, alpha, beta, isMaximizingPlayer) {
        if (depth === 0 || game.game_over()) return evaluateBoard(game);

        let possibleMoves = game.moves();
        possibleMoves.sort((a, b) => {
            let moveA = game.move(a); let scoreA = moveA && moveA.captured ? 1 : 0; game.undo();
            let moveB = game.move(b); let scoreB = moveB && moveB.captured ? 1 : 0; game.undo();
            return scoreB - scoreA;
        });

        if (isMaximizingPlayer) {
            let bestEval = -Infinity;
            for (let move of possibleMoves) {
                game.move(move);
                let eval = minimax(depth - 1, alpha, beta, false);
                game.undo();
                bestEval = Math.max(bestEval, eval);
                alpha = Math.max(alpha, eval);
                if (beta <= alpha) break;
            }
            return bestEval;
        } else {
            let bestEval = Infinity;
            for (let move of possibleMoves) {
                game.move(move);
                let eval = minimax(depth - 1, alpha, beta, true);
                game.undo();
                bestEval = Math.min(bestEval, eval);
                beta = Math.min(beta, eval);
                if (beta <= alpha) break;
            }
            return bestEval;
        }
    }

    function getBestMove(game, depth) {
        let possibleMoves = game.moves();
        let bestMove = null;
        let isMaximizing = game.turn() === 'w';
        let bestValue = isMaximizing ? -Infinity : Infinity;

        possibleMoves.sort(() => Math.random() - 0.5);

        for (let move of possibleMoves) {
            game.move(move);
            let boardValue = minimax(depth - 1, -Infinity, Infinity, !isMaximizing);
            game.undo();

            if (isMaximizing) {
                if (boardValue > bestValue) { bestValue = boardValue; bestMove = move; }
            } else {
                if (boardValue < bestValue) { bestValue = boardValue; bestMove = move; }
            }
        }
        return bestMove;
    }

    // ==========================================
    // ЛОГИКА 2048
    // ==========================================
    let board2048 = [];
    let score2048 = 0;
    let isGameOver2048 = false;
    let isWon2048 = false;

    function init2048() {
        board2048 = Array(16).fill(0);
        score2048 = 0;
        isGameOver2048 = false;
        isWon2048 = false;
        document.getElementById('overlay-2048').classList.add('hidden');
        document.getElementById('overlay-2048').classList.remove('lose');
        
        const gridEl = document.getElementById('grid-2048');
        gridEl.innerHTML = '';
        for (let i = 0; i < 16; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile-2048 tile-empty';
            gridEl.appendChild(tile);
        }

        addRandomTile2048(true);
        addRandomTile2048(true);
        update2048UI(true);
        save2048State();
    }

    function addRandomTile2048(isNewTile = false) {
        const emptyCells = board2048.map((val, index) => val === 0 ? index : null).filter(val => val !== null);
        if (emptyCells.length > 0) {
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board2048[randomCell] = Math.random() < 0.9 ? 2 : 4;
            return randomCell;
        }
        return -1;
    }

    function update2048UI(isInit = false) {
        const gridEl = document.getElementById('grid-2048');
        const tiles = gridEl.children;
        document.getElementById('score-2048').textContent = score2048;

        for (let i = 0; i < 16; i++) {
            const val = board2048[i];
            const tile = tiles[i];

            tile.classList.remove('tile-new', 'tile-merged');
            for (let j = 2; j <= 2048; j *= 2) { tile.classList.remove(`tile-${j}`); }
            tile.classList.remove('tile-super', 'tile-empty');

            if (val === 0) {
                tile.classList.add('tile-empty');
                tile.textContent = '';
            } else {
                let tileClass = val > 2048 ? 'tile-super' : `tile-${val}`;
                tile.classList.add(tileClass);
                tile.textContent = val;
            }
        }
    }

    function move2048(direction) {
        if (isGameOver2048) return;
        
        let moved = false;
        let newBoard = [...board2048];

        for (let i = 0; i < 4; i++) {
            let row = [];
            for (let j = 0; j < 4; j++) {
                let index = 0;
                if (direction === 0) index = i * 4 + j;
                else if (direction === 1) index = i * 4 + (3 - j);
                else if (direction === 2) index = j * 4 + i;
                else if (direction === 3) index = (3 - j) * 4 + i;
                
                if (board2048[index] !== 0) row.push({ val: board2048[index], oldIdx: index });
            }

            for (let j = 0; j < row.length - 1; j++) {
                if (row[j].val === row[j + 1].val) {
                    row[j].val *= 2;
                    score2048 += row[j].val;
                    if (row[j].val === 2048 && !isWon2048) {
                        isWon2048 = true;
                        showOverlay2048("ПОБЕДА! Вы собрали 2048! 🎉", false);
                    }
                    row.splice(j + 1, 1);
                }
            }

            while (row.length < 4) row.push({ val: 0, oldIdx: -1 });

            for (let j = 0; j < 4; j++) {
                let index = 0;
                if (direction === 0) index = i * 4 + j;
                else if (direction === 1) index = i * 4 + (3 - j);
                else if (direction === 2) index = j * 4 + i;
                else if (direction === 3) index = (3 - j) * 4 + i;
                
                if (board2048[index] !== row[j].val) moved = true;
                newBoard[index] = row[j].val;
            }
        }

        if (moved) {
            board2048 = newBoard;
            const newTileIdx = addRandomTile2048();
            update2048UI();
            
            const tiles = document.getElementById('grid-2048').children;
            if (newTileIdx !== -1) tiles[newTileIdx].classList.add('tile-new');
            
            checkGameOver2048();
            save2048State();
        }
    }

    function checkGameOver2048() {
        if (board2048.includes(0)) return;
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                let index = i * 4 + j;
                if (j < 3 && board2048[index] === board2048[index + 1]) return;
                if (i < 3 && board2048[index] === board2048[index + 4]) return;
            }
        }
        isGameOver2048 = true;
        showOverlay2048("хахаха неудачник", true);
    }

    function showOverlay2048(text, isLose) {
        const overlay = document.getElementById('overlay-2048');
        document.getElementById('overlay-2048-text').textContent = text;
        overlay.classList.remove('hidden');
        if (isLose) overlay.classList.add('lose');
    }

    function save2048State() {
        if (currentApp !== '2048') return;
        localStorage.setItem('state2048', JSON.stringify({
            board: board2048, score: score2048, isGameOver: isGameOver2048, isWon: isWon2048
        }));
    }

    function load2048State() {
        const saved = localStorage.getItem('state2048');
        if (saved) {
            const state = JSON.parse(saved);
            board2048 = state.board;
            score2048 = state.score;
            isGameOver2048 = state.isGameOver;
            isWon2048 = state.isWon;
            
            const gridEl = document.getElementById('grid-2048');
            gridEl.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile-2048';
                gridEl.appendChild(tile);
            }
            
            update2048UI(true);
            
            if (isGameOver2048) showOverlay2048("хахаха неудачник", true);
            else if (isWon2048) showOverlay2048("ПОБЕДА! Вы собрали 2048! 🎉", false);
            else document.getElementById('overlay-2048').classList.add('hidden');
        } else {
            init2048();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (currentApp !== '2048') return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            if (e.key === 'ArrowLeft') move2048(0);
            if (e.key === 'ArrowRight') move2048(1);
            if (e.key === 'ArrowUp') move2048(2);
            if (e.key === 'ArrowDown') move2048(3);
        }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    const gameBoard = document.getElementById('app-2048');

    gameBoard.addEventListener('touchstart', e => {
        if (currentApp !== '2048') return;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    gameBoard.addEventListener('touchend', e => {
        if (currentApp !== '2048') return;
        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        
        let dx = touchEndX - touchStartX;
        let dy = touchEndY - touchStartY;

        if (Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 30) { if (dx > 0) move2048(1); else move2048(0); }
        } else {
            if (Math.abs(dy) > 30) { if (dy > 0) move2048(3); else move2048(2); }
        }
    }, { passive: false });


    // ==========================================
    // ИНИЦИАЛИЗАЦИЯ
    // ==========================================
    window.onload = () => {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('app-physics').classList.add('hidden');
        document.getElementById('app-chess').classList.add('hidden');
        document.getElementById('app-2048').classList.add('hidden');

        const savedApp = localStorage.getItem('appMode') || 'menu';
        switchApp(savedApp);
    };
</script>
